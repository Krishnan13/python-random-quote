{% extends 'layout.html' %}

{% block content %}
    <h1>{% block title %} ಬ್ಲಾಗ್ ಲೇಖನಗಳು {% endblock %}</h1>
    {% for post in posts %}
        <div class="post">
            <a href="{{ url_for('post', post_id=post['id']) }}">
                <h2>{{ post['title'] }}</h2>
            </a>
            <span class="badge badge-primary">{{ post['created'] }}</span>
            <hr>
        </div>
    {% endfor %}
{% endblock %}
